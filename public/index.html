<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code2Flow - Code Visualization Tool</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #252526;
      border-bottom: 1px solid #3e3e42;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #fff;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #858585;
      font-weight: 400;
      margin-left: 0.5rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .language-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .language-selector label {
      font-size: 0.875rem;
      color: #cccccc;
    }

    .language-selector select {
      background: #3c3c3c;
      color: #fff;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 0.4rem 0.75rem;
      font-size: 0.875rem;
      cursor: pointer;
      outline: none;
    }

    .language-selector select:hover {
      border-color: #007acc;
    }

    .language-selector select:focus {
      border-color: #007acc;
      box-shadow: 0 0 0 1px #007acc;
    }

    .container {
      display: flex;
      height: calc(100vh - 56px);
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      background: #2d2d30;
      border-bottom: 1px solid #3e3e42;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #cccccc;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header .status {
      font-size: 0.75rem;
      color: #858585;
    }

    .panel-header .status.error {
      color: #f44336;
    }

    .panel-header .status.success {
      color: #4caf50;
    }

    #editor-panel {
      border-right: 1px solid #3e3e42;
    }

    #code-editor {
      flex: 1;
      height: 100%;
    }

    #flowchart-panel {
      background: #1e1e1e;
    }

    #flowchart-container {
      flex: 1;
      overflow: auto;
      padding: 2rem;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #flowchart {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #flowchart svg {
      max-width: 100%;
      height: auto;
    }

    .error-display {
      color: #f44336;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.875rem;
      white-space: pre-wrap;
      background: rgba(244, 67, 54, 0.1);
      border-radius: 4px;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Code2Flow <span class="subtitle">Code Visualization Tool</span></h1>
    </div>
    <div class="header-controls">
      <div class="language-selector">
        <label for="language-select">Language:</label>
        <select id="language-select">
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
        </select>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="panel" id="editor-panel">
      <div class="panel-header">
        <span>Code Editor</span>
        <span id="editor-status" class="status"></span>
      </div>
      <div id="code-editor"></div>
    </div>

    <div class="panel" id="flowchart-panel">
      <div class="panel-header">
        <span>Flowchart Visualization</span>
        <span id="flowchart-status" class="status"></span>
      </div>
      <div id="flowchart-container">
        <div id="flowchart"></div>
      </div>
    </div>
  </div>

  <!-- Acorn.js for JavaScript AST Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/acorn@8.11.3/dist/acorn.min.js"></script>

  <!-- Monaco Editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

  <!-- Mermaid -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: 'basis',
        nodeSpacing: 50,
        rankSpacing: 50
      }
    });

    window.mermaid = mermaid;
  </script>

  <script src="app.js"></script>
</body>
</html>
